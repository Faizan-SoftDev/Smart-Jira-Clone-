services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskcraft
      POSTGRES_USER: taskcraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskcraft -d taskcraft"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://taskcraft:${POSTGRES_PASSWORD:-change-this-local-password}@database:5432/taskcraft
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_CHANNEL_LAYER: "true"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine

  celery:
    build: ./backend
    command: celery -A config worker -l INFO
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://taskcraft:${POSTGRES_PASSWORD:-change-this-local-password}@database:5432/taskcraft
      REDIS_URL: redis://redis:6379/0
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
