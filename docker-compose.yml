services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_jira
      POSTGRES_USER: smart_jira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_jira -d smart_jira"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://smart_jira:${POSTGRES_PASSWORD:-change-this-local-password}@database:5432/smart_jira
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      CREATE_DATABASE_SCHEMA: "true"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
