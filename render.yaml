services:
  - type: web
    name: smart-jira-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-jira-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: smart-jira-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CREATE_DATABASE_SCHEMA
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: keyvalue
    name: smart-jira-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: smart-jira-db
    plan: free
    region: singapore
